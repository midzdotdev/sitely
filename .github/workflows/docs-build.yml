name: docs-build

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: docs check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.4
          run_install: false

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # lychee is the link checker. Install via taiki-e/install-action because
      # the official lycheeverse/lychee-action both installs *and* runs lychee
      # in one go — we want install-only so `pnpm check` is the single entry
      # point for the build + link check.
      - name: Install lychee
        uses: taiki-e/install-action@v2
        with:
          tool: lychee

      - name: Run checks (build + link check)
        run: pnpm check

      - name: Upload built site
        if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: docs-dist
          path: docs/.vitepress/dist
          retention-days: 7
          if-no-files-found: error
