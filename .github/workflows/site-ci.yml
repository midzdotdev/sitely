name: site-ci

# Reusable workflow for sitely community-site packages.
#
# Community-site repos consume this with one line:
#
#     jobs:
#       ci:
#         uses: nicholasgriffintn/wapi/.github/workflows/site-ci.yml@v1
#
# Runs the contracted v0 CI: `sitely build && sitely test`. Every check in
# atlas spec §9 (fixture extraction, schema conformance, determinism,
# schema-emission round-trip, locale matrix, error-path coverage, manifest
# integrity, security smoke + sandbox) runs against the package at the
# repo root.

on:
  workflow_call:
    inputs:
      node-version:
        description: "Node.js version to install."
        required: false
        type: string
        default: "22"
      pnpm-version:
        description: "pnpm version to install."
        required: false
        type: string
        default: "9"
      package-path:
        description: "Path to the package root (relative to repo root). Defaults to repo root."
        required: false
        type: string
        default: "."

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: ${{ inputs.pnpm-version }}

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (compile TS + emit dist/manifest.json + dist/schemas/*.json)
        run: |
          cd ${{ inputs.package-path }}
          pnpm exec tsc
          pnpm exec sitely build

      - name: Test (8 must-pass CI checks)
        run: |
          cd ${{ inputs.package-path }}
          pnpm exec sitely test
