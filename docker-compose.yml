services:
  wapi:
    build: .
    ports: ["3000:3000"]
    volumes:
      - ./sites:/app/sites
    environment:
      DATABASE_URL: postgres://wapi:wapi@postgres:5432/wapi
      REDIS_URL: redis://redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: minioadmin
      S3_SECRET_KEY: minioadmin
      S3_BUCKET: wapi-media
    depends_on: [postgres, redis, minio]

  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: wapi
      POSTGRES_PASSWORD: wapi
      POSTGRES_DB: wapi
    ports: ["5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]

  minio:
    image: minio/minio
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - miniodata:/data

volumes:
  pgdata:
  miniodata:
